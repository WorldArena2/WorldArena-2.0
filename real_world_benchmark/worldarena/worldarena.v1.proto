syntax = "proto3";

package worldarena.v1;

// Reference protobuf schema aligned with WorldArena 2.0 Notion design.
// Online transport may use msgpack-JSON with identical field semantics.

message Vector3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

message Quaternion {
  double x = 1;
  double y = 2;
  double z = 3;
  double w = 4;
}

message Pose {
  Vector3 position_m = 1;
  Quaternion orientation_xyzw = 2;
  string frame = 3;
}

message SessionContext {
  string schema_version = 1;
  string session_id = 2;
  string episode_id = 3;
  string task_id = 4;
  string task_instruction = 5;
  string embodiment_id = 6;
  string embodiment_type = 7;
  string policy_id = 8;
  string policy_interface_version = 9;
  string adapter_version = 10;
}

message JointState {
  repeated string joint_names = 1;
  repeated double position_rad = 2;
  repeated double velocity_rad_s = 3;
  repeated double effort = 4;
}

message GripperState {
  double open_ratio = 1;
  double width_m = 2;
  bool is_holding_object = 3;
}

message ArmState {
  string arm_id = 1;
  JointState joint_state = 2;
  Pose ee_pose_base = 3;
  GripperState gripper = 4;
}

message RobotState {
  repeated ArmState arms = 1;
  Pose base_pose_world = 2;
  map<string, string> raw_state_refs = 3;
}

message CameraObservation {
  string camera_role = 1;
  string modality = 2;
  string frame_id = 3;
  int64 timestamp_ns = 4;
  int32 width = 5;
  int32 height = 6;
  double fps = 7;
  string encoding = 8;
  bytes frame_bytes = 9;  // latest frame
  string transport_ref = 10;
  repeated bytes frame_history_bytes = 11;  // older frames, oldest-first
  repeated int64 frame_history_timestamps_ns = 12;
}

message SafetyState {
  bool emergency_stop_active = 1;
  bool velocity_limit_active = 2;
  bool workspace_limit_active = 3;
  bool action_clipped = 4;
  string safety_status = 5;
  repeated string active_constraints = 6;
}

message NetworkState {
  double uplink_latency_ms = 1;
  double downlink_latency_ms = 2;
  double round_trip_time_ms = 3;
  double jitter_ms = 4;
  bool packet_drop_detected = 5;
}

message TactileField {
  string field_type = 1;
  repeated int32 shape = 2;
  string dtype = 3;
  string units = 4;
  string encoding = 5;
  bytes data_bytes = 6;
  string transport_ref = 7;
}

message TactileObservation {
  string tactile_role = 1;
  string sensor_vendor = 2;
  string sensor_serial = 3;
  string sensor_model = 4;
  int64 timestamp_ns = 5;
  string frame_id = 6;
  bool contact_state = 7;
  float contact_confidence = 8;
  repeated double wrench_6d = 9;
  repeated TactileField fields = 10;
  string runtime_config_ref = 11;
  map<string, string> raw_refs = 12;
  repeated TactileFieldHistory fields_history = 13;
  repeated int64 fields_history_timestamps_ns = 14;
}

message TactileFieldHistory {
  repeated TactileField fields = 1;
}

message ObservationPacket {
  SessionContext context = 1;
  int64 observation_timestamp_ns = 2;
  int64 step_index = 3;
  RobotState robot_state = 4;
  repeated CameraObservation camera_observations = 5;
  SafetyState safety_state = 6;
  NetworkState network_state = 7;
  repeated TactileObservation tactile_observations = 8;
  repeated RobotState robot_state_history = 9;  // older states, oldest-first
  map<string, int32> history_actual = 10;
}

message ArmAction {
  string arm_id = 1;
  Vector3 delta_position_m = 2;
  Vector3 delta_rotation_axis_angle = 3;
  Pose target_pose_base = 4;
  repeated double joint_position_rad = 5;
  double gripper_target_open_ratio = 6;
}

message ActionStep {
  int32 relative_step = 1;
  repeated ArmAction arm_actions = 2;
}

message ActionPacket {
  SessionContext context = 1;
  int64 observation_timestamp_ns = 2;
  int64 inference_timestamp_ns = 3;
  int64 action_apply_timestamp_ns = 4;
  string action_mode = 5;
  repeated ActionStep action_chunk = 6;
  int32 expected_horizon_steps = 7;
  double policy_latency_ms = 8;
  double confidence = 9;
  string status = 10;
  string error_message = 11;
}

message EpisodeEvent {
  SessionContext context = 1;
  int64 event_timestamp_ns = 2;
  string event_type = 3;
  string event_message = 4;
  map<string, string> metadata = 5;
}
